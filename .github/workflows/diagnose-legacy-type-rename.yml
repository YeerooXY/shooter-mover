name: Diagnose legacy type rename

on:
  push:
    branches:
      - agent/remove-legacy-names-everywhere

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-legacy-names-everywhere
          fetch-depth: 0

      - name: Record rename blockers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import collections
          import re

          root = Path('Assets/ShooterMover')
          declaration = re.compile(r'\b(?:class|interface|struct|enum|record)\s+([A-Za-z_][A-Za-z0-9_]*)')
          namespace_re = re.compile(r'\bnamespace\s+([A-Za-z_][A-Za-z0-9_.]*)')
          camel = re.compile(r'[A-Z]+(?=[A-Z][a-z]|\d|$)|[A-Z]?[a-z]+|\d+')
          version = re.compile(r'V\d+(?=[A-Z_]|$)')
          replacements = {
              'Production': '', 'Canonical': '', 'Composition': 'Setup',
              'Projection': 'View', 'Authority': 'State', 'Adapter': 'Bridge',
              'Runtime': 'Live', 'Service': 'Actions', 'Coordinator': 'Flow',
          }
          custom = {
              'ProductionWeaponInventoryStateV1': 'LegacyWeaponInventory',
              'ProductionWeaponInventoryStateV2': 'WeaponInventory',
              'ProductionWeaponMountBindingV1': 'WeaponMountViewBinding',
              'WeaponMountBindingV2': 'WeaponMountBinding',
              'ProductionWeaponOnboardingV1': 'LegacyWeaponSetup',
              'ProductionWeaponOnboardingV2': 'WeaponOnboarding',
              'RoomLiveRuntimeAuthorityV1': 'RoomFlowState',
              'RoomRuntimeAuthorityV1': 'RoomOccupancyState',
              'V1DecorDto': 'RoomContentDecorDto',
              'V1DoorDto': 'RoomContentDoorDto',
              'V1DoorLinkDto': 'RoomContentDoorLinkDto',
              'V1EncounterDto': 'RoomContentEncounterDto',
              'V1EnemiesDto': 'RoomContentEnemiesDto',
              'V1ManifestDto': 'RoomContentManifestDto',
              'V1PropsDto': 'RoomContentPropsDto',
              'V1RoomDocumentsDto': 'RoomContentDocumentsDto',
              'V1RoomLayoutDto': 'RoomContentLayoutDto',
              'V1SpawnDto': 'RoomContentSpawnDto',
              'CollectedRunRewardPreparedTransferAuthorityV1': 'CollectedRunRewardPreparedTransferStore',
              'CollectedRunRewardPreparedTransferStateV1': 'CollectedRunRewardPreparedTransferState',
              'ICollectedRunEquipmentPayloadSourceV2': 'ICollectedRunWeaponPayloadSource',
              'DestructiblePropAuthority': 'DestructiblePropDamage',
              'StatusEffectCommandCanonicalV1': 'StatusEffectCommand',
              'StatusEffectCommandV1': 'LegacyStatusEffectCommand',
              'StatusEffectAuthoritySnapshotV1': 'StatusEffectLedgerSnapshot',
              'StatusEffectStateSnapshotV1': 'StatusEffectStateSnapshot',
              'DoorDtoV2': 'AuthoredDoorDto',
              'DoorsDtoV2': 'AuthoredDoorsDto',
              'EndpointDtoV2': 'AuthoredEndpointDto',
              'LevelDtoV2': 'AuthoredLevelDto',
              'MapDtoV2': 'AuthoredMapDto',
              'MapNodeDtoV2': 'AuthoredMapNodeDto',
              'RoomDtoV2': 'AuthoredRoomDto',
              'RoomIndexDtoV2': 'AuthoredRoomIndexDto',
              'RoomLiveRuntimeAuthorityTests': 'RoomFlowStateTests',
              'RoomRuntimeAuthorityTests': 'RoomOccupancyStateTests',
          }

          def clean(name):
              if name in custom:
                  return custom[name]
              output = []
              for word in camel.findall(version.sub('', name)):
                  mapped = replacements.get(word, word)
                  if mapped and (not output or output[-1] != mapped):
                      output.append(mapped)
              return ''.join(output)

          declared = set()
          by_scope = collections.defaultdict(set)
          for path in sorted(root.rglob('*.cs')):
              text = path.read_text(encoding='utf-8-sig')
              match = namespace_re.search(text)
              namespace = match.group(1) if match else '<global>'
              for found in declaration.finditer(text):
                  old = found.group(1)
                  declared.add(old)
                  by_scope[(namespace, clean(old))].add(old)

          report = ['# Repository Rename Diagnostic', '']
          missing = sorted(set(custom) - declared)
          report.append(f'- Missing custom keys: **{len(missing)}**')
          for name in missing:
              report.append(f'  - `{name}`')

          collisions = []
          for (namespace, proposed), old_names in sorted(by_scope.items()):
              if not proposed or len(old_names) > 1:
                  collisions.append((namespace, proposed, sorted(old_names)))
          report.append(f'- Remaining same-namespace collisions: **{len(collisions)}**')
          for namespace, proposed, old_names in collisions:
              report.append(f'  - `{namespace}.{proposed or "<empty>"}`: ' + ', '.join(f'`{name}`' for name in old_names))

          mapping = {name: clean(name) for name in declared if clean(name) != name}
          def moved(path):
              name = path.name
              if name.endswith('.cs.meta'):
                  body, ending = name[:-8], '.cs.meta'
              elif name.endswith('.cs'):
                  body, ending = name[:-3], '.cs'
              else:
                  return path
              pieces = [mapping.get(piece, clean(piece)) for piece in body.split('.')]
              return path.with_name('.'.join(pieces) + ending)

          moves = []
          for path in sorted(root.rglob('*.cs')):
              target = moved(path)
              if target != path:
                  moves.append((path, target))
              meta = Path(str(path) + '.meta')
              if meta.exists():
                  target = moved(meta)
                  if target != meta:
                      moves.append((meta, target))
          moving = {old for old, _ in moves}
          targets = collections.defaultdict(list)
          for old, new in moves:
              targets[new].append(old)
          file_collisions = []
          for target, sources in sorted(targets.items(), key=lambda item: str(item[0])):
              if len(sources) > 1:
                  file_collisions.append((target, sources, 'multiple sources'))
              elif target.exists() and target not in moving:
                  file_collisions.append((target, sources, 'target exists'))
          report.append(f'- File move collisions: **{len(file_collisions)}**')
          for target, sources, reason in file_collisions:
              report.append(f'  - `{target}` ({reason}): ' + ', '.join(f'`{source}`' for source in sources))

          Path('docs/audits/REPOSITORY_RENAME_DIAGNOSTIC.md').write_text(
              '\n'.join(report) + '\n', encoding='utf-8')
          PY

          git config user.name "shooter-mover-naming-bot"
          git config user.email "naming-bot@users.noreply.github.com"
          rm .github/workflows/diagnose-legacy-type-rename.yml
          git add -A
          git diff --check
          git commit -m "Record repository rename blockers"
          git push origin HEAD:agent/remove-legacy-names-everywhere
