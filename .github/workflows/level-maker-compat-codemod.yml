name: Apply Level Maker compatibility codemod

on:
  push:
    branches:
      - agent/remove-level-maker-compat-names
    paths:
      - "tools/level-maker/apply-compat-codemod.cjs"
      - "tools/level-maker/app-*.js"
      - ".github/workflows/level-maker-compat-codemod.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-level-maker-compat-names
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply replacements
        working-directory: tools/level-maker
        run: node apply-compat-codemod.cjs
      - name: Commit replacements
        run: |
          if git diff --quiet; then
            echo "No replacements needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/level-maker/app-*.js
          git commit -m "Use canonical Level Maker state paths"
          git push origin HEAD:agent/remove-level-maker-compat-names
