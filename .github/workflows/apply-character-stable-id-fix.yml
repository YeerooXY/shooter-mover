name: Apply character StableId fix

on:
  push:
    branches:
      - fix/character-account-stable-id

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/character-account-stable-id
          fetch-depth: 0
      - name: Apply targeted fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("Assets/ShooterMover/UI/Game/CharacterSave.cs")
          text = path.read_text(encoding="utf-8")
          old = 'StableId.Parse("account.production-player-v1")'
          new = 'StableId.Parse("account-production-player-v1")'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one malformed account StableId, found {count}.")
          path.write_text(text.replace(old, new), encoding="utf-8")

          workflow = Path(".github/workflows/apply-character-stable-id-fix.yml")
          workflow.unlink()
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix character account StableId"
          git push origin HEAD:fix/character-account-stable-id
