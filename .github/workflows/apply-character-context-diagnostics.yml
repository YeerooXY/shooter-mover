name: Apply character context diagnostics

on:
  push:
    branches:
      - agent/playable-character-context-001
    paths:
      - .github/workflows/apply-character-context-diagnostics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/playable-character-context-001
          fetch-depth: 0
      - name: Apply diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          migration = Path("Assets/ShooterMover/Runtime/Application/Flow/Production/RetiredWeaponSaveMigrationV1.cs")
          replace_once(
              migration,
              '''            catch (Exception exception)
                      {
                          return Failure(
                              "retired-weapon-migration-threw:"
                              + exception.GetType().Name,
                              account);
                      }
          ''',
              '''            catch (Exception exception)
                      {
                          return Failure(
                              "retired-weapon-migration-threw:"
                                  + DescribeException(exception),
                              account);
                      }
          ''')
          replace_once(
              migration,
              '''        private static RetiredWeaponSaveMigrationResultV1 Failure(
          ''',
              '''        private static string DescribeException(Exception exception)
                  {
                      if (exception == null)
                      {
                          return "Exception";
                      }
                      Exception root = exception.GetBaseException() ?? exception;
                      string description = exception.GetType().Name;
                      if (!ReferenceEquals(root, exception))
                      {
                          description += "->" + root.GetType().Name;
                      }
                      if (string.IsNullOrWhiteSpace(root.Message))
                      {
                          return description;
                      }
                      string message = root.Message
                          .Replace('\\r', ' ')
                          .Replace('\\n', ' ')
                          .Trim();
                      return description + ":" + message;
                  }

                  private static RetiredWeaponSaveMigrationResultV1 Failure(
          ''')

          account = Path("Assets/ShooterMover/UI/ProductionFlow/ProductionCharacterAccountCompositionV1.cs")
          replace_once(
              account,
              '''            if (!initialized || composition == null || flow == null)
                      {
                          return false;
                      }

                      ProductionFlowProfileRecordV1 selectedProfile = flow.Profile;
                      if (selectedProfile == null)
                      {
                          composition.UnbindActive();
                          currentProfile = null;
                          return false;
                      }
          ''',
              '''            if (!initialized || composition == null || flow == null)
                      {
                          diagnostic = "character-composition-not-ready";
                          return false;
                      }

                      ProductionFlowProfileRecordV1 selectedProfile = flow.Profile;
                      if (selectedProfile == null)
                      {
                          composition.UnbindActive();
                          currentProfile = null;
                          diagnostic = "character-composition-selected-profile-missing";
                          return false;
                      }
          ''')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/ShooterMover/Runtime/Application/Flow/Production/RetiredWeaponSaveMigrationV1.cs \
                  Assets/ShooterMover/UI/ProductionFlow/ProductionCharacterAccountCompositionV1.cs
          git commit -m "Preserve character context root diagnostics"
          git push origin HEAD:agent/playable-character-context-001
