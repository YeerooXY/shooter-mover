name: Restore account StableId

on:
  push:
    branches:
      - fix/restore-account-stable-id

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-account-stable-id
      - name: Restore valid namespaced StableId
        shell: python
        run: |
          from pathlib import Path
          path = Path('Assets/ShooterMover/UI/Game/CharacterSave.cs')
          text = path.read_text(encoding='utf-8')
          old = 'StableId.Parse("account-production-player-v1");'
          new = 'StableId.Parse("account.production-player-v1");'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one malformed account ID, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/restore-account-stable-id.yml').unlink()
      - name: Commit clean targeted diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/ShooterMover/UI/Game/CharacterSave.cs .github/workflows/restore-account-stable-id.yml
          git commit -m "Restore valid character account StableId"
          git push origin HEAD:fix/restore-account-stable-id
