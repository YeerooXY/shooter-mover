name: Level Maker compatibility audit

on:
  push:
    branches:
      - agent/remove-level-maker-compat-names
    paths:
      - "tools/level-maker/**"
      - ".github/workflows/level-maker-compat-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: List compatibility-name usages
        working-directory: tools/level-maker
        run: node compat-audit.cjs
