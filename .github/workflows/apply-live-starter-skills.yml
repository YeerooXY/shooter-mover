name: Apply live starter skills

on:
  push:
    branches:
      - agent/live-starter-skills

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-starter-skills
          fetch-depth: 0

      - name: Patch skill integrations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          foundation = "Assets/ShooterMover/Runtime/Domain/Progression/Skills/RankedSkillFoundation.cs"
          old_catalog = '''            Func<decimal, decimal[]> fifteen = step => Enumerable.Range(1, 15).Select(x => x * step).ToArray();
            var armor = new RankedSkillDefinition("generic.armor", "defense", 6, null, null, null,
                new[] { new SkillClassOverride("juggernaut", 18, Enumerable.Range(1, 18).Select(x => x * 0.01m)) }, Enumerable.Range(1, 6).Select(x => x * 0.01m),
                new[] { new SkillEffectDescriptor("character.armor", SkillModifierKind.Percentage, 1m) }, null);
            var speed = new RankedSkillDefinition("generic.movement_speed", "mobility", 18, null, null, null,
                new[] { new SkillClassOverride("combat_medic", 6, Enumerable.Range(1, 6).Select(x => x * 0.01m)), new SkillClassOverride("juggernaut", 9, Enumerable.Range(1, 9).Select(x => x * 0.01m)) }, Enumerable.Range(1, 18).Select(x => x * 0.01m),
                new[] { new SkillEffectDescriptor("movement.speed", SkillModifierKind.Percentage, 1m) }, null);
            var recovery = new RankedSkillDefinition("striker.thruster_recovery", "mobility", 15, new[] { "striker" }, null, null, null, fifteen(0.01m), new[] { new SkillEffectDescriptor("movement.thruster_recovery", SkillModifierKind.Percentage, 1m) }, new[] { new SkillRankMilestone(5, new[] { new SkillEffectDescriptor("movement.recovery_delay", SkillModifierKind.Flat, -0.1m) }) });
            var efficiency = new RankedSkillDefinition("striker.movement_efficiency", "mobility", 15, new[] { "striker" }, new[] { new SkillPrerequisite("generic.movement_speed", 3) }, null, null, fifteen(0.01m), new[] { new SkillEffectDescriptor("movement.energy_efficiency", SkillModifierKind.Percentage, 1m) }, null);'''
          new_catalog = '''            Func<int, decimal[]> perRank = count =>
                Enumerable.Repeat(0.01m, count).ToArray();
            var armor = new RankedSkillDefinition("generic.armor", "defense", 6, null, null, null,
                new[] { new SkillClassOverride("juggernaut", 18, perRank(18)) }, perRank(6),
                new[] { new SkillEffectDescriptor("character.armor", SkillModifierKind.Percentage, 1m) }, null);
            var speed = new RankedSkillDefinition("generic.movement_speed", "mobility", 18, null, null, null,
                new[] { new SkillClassOverride("combat_medic", 6, perRank(6)), new SkillClassOverride("juggernaut", 9, perRank(9)) }, perRank(18),
                new[] { new SkillEffectDescriptor("movement.speed", SkillModifierKind.Percentage, 1m) }, null);
            var recovery = new RankedSkillDefinition("striker.thruster_recovery", "mobility", 15, new[] { "striker" }, null, null, null, perRank(15), new[] { new SkillEffectDescriptor("movement.thruster_recovery", SkillModifierKind.Percentage, 1m) }, new[] { new SkillRankMilestone(5, new[] { new SkillEffectDescriptor("movement.recovery_delay", SkillModifierKind.Flat, -0.1m) }) });
            var efficiency = new RankedSkillDefinition("striker.movement_efficiency", "mobility", 15, new[] { "striker" }, new[] { new SkillPrerequisite("generic.movement_speed", 3) }, null, null, perRank(15), new[] { new SkillEffectDescriptor("movement.energy_efficiency", SkillModifierKind.Percentage, 1m) }, null);'''
          replace_once(foundation, old_catalog, new_catalog)

          damage = "Assets/ShooterMover/UI/Game/EnemyPlayerDamageIntegration.cs"
          replace_once(
              damage,
              '''                        hit.ResolvedDamage,
                        channel,''',
              '''                        ScaleDamage(hit.ResolvedDamage),
                        channel,''')
          replace_once(
              damage,
              '''        private void HandlePlayerDefeated(PlayablePlayerDefeatedFact fact)
        {''',
              '''        private double ScaleDamage(double amount)
        {
            SkillMove skills = playerMarker == null
                ? null
                : playerMarker.GetComponent<SkillMove>();
            return skills == null
                ? amount
                : skills.ScaleIncomingDamage(amount);
        }

        private void HandlePlayerDefeated(PlayablePlayerDefeatedFact fact)
        {''')

          session = "Assets/ShooterMover/Runtime/Application/Skills/Presentation/RankedSkillsScreenSession.cs"
          replace_once(
              session,
              '''                    definition.Id, definition.Id, "Category: " + definition.CategoryId,''',
              '''                    definition.Id, Name(definition.Id), Description(definition.Id),''')
          replace_once(
              session,
              '''        private static bool Reject(string code, out string rejectionCode)
        { rejectionCode = code; return false; }''',
              '''        private static string Name(string skillId)
        {
            switch (skillId)
            {
                case "generic.armor": return "Armor";
                case "generic.movement_speed": return "Movement Speed";
                case "striker.thruster_recovery": return "Thruster Recovery";
                case "striker.movement_efficiency": return "Movement Efficiency";
                default: return skillId;
            }
        }

        private static string Description(string skillId)
        {
            switch (skillId)
            {
                case "generic.armor":
                    return "Take 1% less damage per rank.";
                case "generic.movement_speed":
                    return "Move 1% faster per rank.";
                case "striker.thruster_recovery":
                    return "Recharge thruster charges 1% faster per rank. Rank 5 removes another 0.1 seconds.";
                case "striker.movement_efficiency":
                    return "Dash 1% longer per rank. Reach rank 8 in both thruster skills for a third charge.";
                default:
                    return string.Empty;
            }
        }

        private static bool Reject(string code, out string rejectionCode)
        { rejectionCode = code; return false; }''')
          PY

          rm .github/workflows/apply-live-starter-skills.yml
          rm -f .github/skill-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire starter skills into live gameplay"
          git push origin HEAD:agent/live-starter-skills
