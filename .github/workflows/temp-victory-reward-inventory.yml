name: Temporary victory reward API inventory

on:
  push:
    branches:
      - feature/save-victory-rewards
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-victory-reward-inventory.yml'
      - 'Assets/ShooterMover/**'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Print surviving reward boundaries
        shell: bash
        run: |
          set -euo pipefail
          echo '=== FILES WITH MONEY/SCRAP MUTATION TYPES ==='
          git grep -l -E 'MoneyWalletActions|ScrapWalletActions|MoneyWallet|ScrapWallet' -- 'Assets/ShooterMover/**/*.cs' | sort || true

          echo '=== FILES WITH STRONGBOX OWNERSHIP/OPENING TYPES ==='
          git grep -l -E 'StrongboxOpeningActions|StrongboxInstanceContext|Strongbox.*State|Strongbox.*Actions|UnopenedStrongbox|Register.*Strongbox|OpenStrongbox' -- 'Assets/ShooterMover/**/*.cs' | sort || true

          echo '=== FILES WITH COLLECTED RUN REWARD EXPORT ==='
          git grep -l -E 'ExportCollectedRunRewards|CollectedRunReward|CollectedReward|RewardGrantKind' -- 'Assets/ShooterMover/**/*.cs' | sort || true

          echo '=== MONEY/SCRAP MUTATION SIGNATURES ==='
          git grep -n -E 'class MoneyWalletActions|class ScrapWalletActions|public .*Money|public .*Scrap|Apply\(|Credit\(|AddMoney|AddScrap' -- 'Assets/ShooterMover/**/*.cs' | head -n 500 || true

          echo '=== STRONGBOX SIGNATURES ==='
          git grep -n -E 'class .*Strongbox|struct .*Strongbox|public .*Strongbox|Register.*Strongbox|Open.*Strongbox|Create.*Strongbox|StrongboxInstanceContext' -- 'Assets/ShooterMover/**/*.cs' | head -n 1000 || true

          echo '=== COLLECTED RUN SIGNATURES ==='
          git grep -n -E 'ExportCollectedRunRewards|CollectedRunReward|RewardGrantKind' -- 'Assets/ShooterMover/**/*.cs' | head -n 1000 || true
