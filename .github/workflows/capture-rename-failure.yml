name: Capture rename failure

on:
  push:
    branches:
      - agent/remove-legacy-names-everywhere

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-legacy-names-everywhere
          fetch-depth: 0

      - name: Run exact rename script and record failure
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /python3 - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/remove-legacy-type-names.yml > /tmp/rename.py

          set +e
          python3 /tmp/rename.py > /tmp/rename-output.txt 2>&1
          status=$?
          set -e

          git reset --hard HEAD
          {
            echo "# Repository Rename Failure"
            echo
            echo "- Exit status: **$status**"
            echo
            echo '```text'
            cat /tmp/rename-output.txt
            echo '```'
          } > docs/audits/REPOSITORY_RENAME_FAILURE.md

          git config user.name "shooter-mover-naming-bot"
          git config user.email "naming-bot@users.noreply.github.com"
          rm .github/workflows/capture-rename-failure.yml
          git add -A
          git diff --check
          git commit -m "Capture repository rename failure"
          git push origin HEAD:agent/remove-legacy-names-everywhere
