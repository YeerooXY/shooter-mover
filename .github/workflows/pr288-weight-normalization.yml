name: PR288 weight normalization

on:
  push:
    branches:
      - codex/pr288-weapon-migration

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate on current weight scale
        run: |
          node tools/migrations/apply-pr288-weight-normalization.js
          git diff --check
          node --check tools/migrations/import-pr288-weapons.js
          git add -A
          git diff --cached --binary > /tmp/first.patch
          node tools/migrations/import-pr288-weapons.js > /tmp/pr288-rerun.json
          git add -A
          git diff --cached --binary > /tmp/second.patch
          cmp /tmp/first.patch /tmp/second.patch
      - name: Commit correction
        run: |
          rm -f .github/workflows/pr288-weight-normalization.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Normalize PR #288 drop weights to current scale"
          git push

# Explicit retrigger after the workflow file was added on the branch.
