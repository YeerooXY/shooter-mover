name: Rebuild legacy loadout cleanup on main

on:
  push:
    branches:
      - cleanup/remove-legacy-loadout-system-rebased

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-legacy-loadout-system-rebased
          fetch-depth: 0

      - name: Apply audited cleanup tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/remove-legacy-loadout-system

          git checkout origin/cleanup/remove-legacy-loadout-system -- \
            Assets/ShooterMover/Runtime/Application/Flow/Game/CharacterLiveGraph.cs \
            Assets/ShooterMover/Runtime/Application/Flow/Game/CharacterStateAdapters.cs \
            Assets/ShooterMover/Runtime/Application/Flow/Game/InventoryMenu.cs \
            Assets/ShooterMover/Runtime/Application/Flow/Game/PlayerLoadoutLive.cs \
            Assets/ShooterMover/Runtime/Application/Flow/Game/StarterLoadout.cs \
            Assets/ShooterMover/Runtime/Application/Inventory/LoadoutScreen/InventoryLoadoutScreen.cs \
            Assets/ShooterMover/Runtime/Application/Persistence/Composition/CharacterSetupFlow.cs \
            Assets/ShooterMover/Runtime/Application/Persistence/SaveParts/GameSaveRules.cs \
            Assets/ShooterMover/Runtime/Application/Persistence/SaveParts/KnownLedgerScrapSkillLoadoutCodecs.cs \
            Assets/ShooterMover/Runtime/Application/Persistence/SaveParts/KnownSavePartCodecCore.cs \
            Assets/ShooterMover/Runtime/Application/Persistence/SaveParts/KnownSavePartVersionGuard.cs \
            Assets/ShooterMover/Runtime/Application/Persistence/SaveParts/SavePartAdapters.cs \
            Assets/ShooterMover/Tests/PlayMode/Flow/InventoryLoadout/InventoryLoadoutStateConnectionTests.cs \
            Assets/ShooterMover/UI/Game/CharacterSave.cs \
            Assets/ShooterMover/UI/Game/InventoryLoadoutFlow.cs \
            Assets/ShooterMover/UI/InventoryLoadout/InventoryMenu.cs

          git rm -f --ignore-unmatch \
            Assets/ShooterMover/Runtime/Application/Flow/Game/RetiredArmorLoadoutCompatibility.cs \
            Assets/ShooterMover/Runtime/Application/Flow/Game/RetiredArmorLoadoutCompatibility.cs.meta \
            Assets/ShooterMover/Tests/EditMode/Inventory/LoadoutScreen/InventoryLoadoutScreenActionsTests.cs \
            Assets/ShooterMover/Tests/EditMode/Inventory/LoadoutScreen/InventoryLoadoutScreenActionsTests.cs.meta \
            docs/architecture/items/LEGACY_ARMOR_LOADOUT_RETIREMENT.md

          rm -f .github/workflows/rebase-legacy-loadout-cleanup.yml

          if rg -n --hidden \
            -g '!Library/**' \
            -g '!Temp/**' \
            -g '!Logs/**' \
            -g '!.git/**' \
            -e 'RetiredArmorLoadoutCompatibility' \
            -e 'ExactInstanceLoadout' \
            -e 'InventoryLoadoutStateSnapshot' \
            -e 'InventoryLoadoutStateCommand' \
            -e 'InventoryLoadoutStateResult' \
            -e 'InventoryLoadoutStateMutationStatus' \
            -e 'IInventoryLoadoutStatePort' \
            -e 'InventoryLoadoutSlots' \
            -e 'InventoryLoadoutSlotIds' \
            -e 'InventoryLoadoutScreenActions' \
            -e 'InventoryLoadoutScreenSnapshot' \
            -e 'ArmorHead' \
            -e 'ArmorBody' \
            -e 'ArmorLegs' \
            -e 'ArmorFeet' \
            -e 'armor-slot\.' \
            -e 'legacyService' \
            -e 'CompatibilitySnapshot' \
            -e '\.LoadoutAuthority' \
            .; then
            echo 'Legacy loadout references remain.' >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove legacy armor loadout system"
          git push origin HEAD:cleanup/remove-legacy-loadout-system-rebased
