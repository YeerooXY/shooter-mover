name: PR288 current loot authority

on:
  push:
    branches:
      - codex/pr288-weapon-migration

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove legacy weight from live generation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          importer = Path('tools/migrations/import-pr288-weapons.js')
          text = importer.read_text()
          replacements = [
              ('      lines.push(`                            ${csharpNumber(d.FinalBaseWeight)},`);\n', ''),
              ('            public Pr288MarkSource(int mark, int peak, double weight, FireSettings fire, GunShotPattern shot, double damage, GunDamageCategory category, int pierce, double knockback, double range, double speed, double radius)\n',
               '            public Pr288MarkSource(int mark, int peak, FireSettings fire, GunShotPattern shot, double damage, GunDamageCategory category, int pierce, double knockback, double range, double speed, double radius)\n'),
              ('                Mark = mark; Peak = peak; Weight = weight; Fire = fire; Shot = shot; Damage = damage; Category = category; Pierce = pierce; Knockback = knockback; Range = range; Speed = speed; Radius = radius;\n',
               '                Mark = mark; Peak = peak; Fire = fire; Shot = shot; Damage = damage; Category = category; Pierce = pierce; Knockback = knockback; Range = range; Speed = speed; Radius = radius;\n'),
              ('            public int Mark { get; } public int Peak { get; } public double Weight { get; }\n',
               '            public int Mark { get; } public int Peak { get; }\n'),
              ('                        GunDropAvailability.Live, source.Peak, source.Weight,\n',
               '                        GunDropAvailability.Live, source.Peak, 1d,\n'),
              ('    "- Because current production rarity is family-owned, generated families use the highest normalized rarity among their Marks.",\n',
               '    "- Because current production rarity is family-owned, generated families use the highest normalized rarity among their Marks.",\n    "- Historical PR #288 selection weights remain in the migration manifest for traceability only. Live generated definitions use neutral base selection weight `1`; the current level and rarity rules own distribution.",\n')
          ]
          for before, after in replacements:
              if before not in text:
                  raise SystemExit(f'missing importer replacement: {before[:100]!r}')
              text = text.replace(before, after, 1)
          importer.write_text(text)

          generated = Path('Assets/ShooterMover/Runtime/Application/Guns/Catalog/GunCatalogue.Pr288.Generated.cs')
          text = generated.read_text()
          import re
          text, count = re.subn(r'(new Pr288MarkSource\(\n\s+\d+, \d+,\n)\s+[-+0-9.eEdD]+,\n', r'\1', text)
          if count != 33:
              raise SystemExit(f'expected 33 generated weight arguments, removed {count}')
          replacements = [
              ('            public Pr288MarkSource(int mark, int peak, double weight, FireSettings fire, GunShotPattern shot, double damage, GunDamageCategory category, int pierce, double knockback, double range, double speed, double radius)\n',
               '            public Pr288MarkSource(int mark, int peak, FireSettings fire, GunShotPattern shot, double damage, GunDamageCategory category, int pierce, double knockback, double range, double speed, double radius)\n'),
              ('                Mark = mark; Peak = peak; Weight = weight; Fire = fire; Shot = shot; Damage = damage; Category = category; Pierce = pierce; Knockback = knockback; Range = range; Speed = speed; Radius = radius;\n',
               '                Mark = mark; Peak = peak; Fire = fire; Shot = shot; Damage = damage; Category = category; Pierce = pierce; Knockback = knockback; Range = range; Speed = speed; Radius = radius;\n'),
              ('            public int Mark { get; } public int Peak { get; } public double Weight { get; }\n',
               '            public int Mark { get; } public int Peak { get; }\n'),
              ('                        GunDropAvailability.Live, source.Peak, source.Weight,\n',
               '                        GunDropAvailability.Live, source.Peak, 1d,\n')
          ]
          for before, after in replacements:
              if before not in text:
                  raise SystemExit(f'missing generated replacement: {before[:100]!r}')
              text = text.replace(before, after, 1)
          generated.write_text(text)

          report = Path('Documentation/Weapons/PR288_CONVERSION_REPORT.md')
          text = report.read_text()
          anchor = '- Because current production rarity is family-owned, generated families use the highest normalized rarity among their Marks.\n'
          addition = anchor + '- Historical PR #288 selection weights remain in the migration manifest for traceability only. Live generated definitions use neutral base selection weight `1`; the current level and rarity rules own distribution.\n'
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('report anchor missing')
              text = text.replace(anchor, addition, 1)
          report.write_text(text)
          PY

          node --check tools/migrations/import-pr288-weapons.js
          git diff --check
          for folder in Content/Weapons/*/*; do
            node tools/item-maker/validate-weapon-folder.js "$folder"
            node tools/item-maker/compile-weapon-folder.js "$folder" >/dev/null
          done

          cp Assets/ShooterMover/Runtime/Application/Guns/Catalog/GunCatalogue.Pr288.Generated.cs /tmp/generated-before.cs
          cp Documentation/Weapons/PR288_CONVERSION_REPORT.md /tmp/report-before.md
          node tools/migrations/import-pr288-weapons.js >/tmp/pr288-rerun.json
          cmp /tmp/generated-before.cs Assets/ShooterMover/Runtime/Application/Guns/Catalog/GunCatalogue.Pr288.Generated.cs
          cmp /tmp/report-before.md Documentation/Weapons/PR288_CONVERSION_REPORT.md
          git diff --check

      - name: Commit corrected migration
        run: |
          rm -f .github/workflows/pr288-current-loot-authority.yml
          rm -f .github/workflows/pr288-weight-normalization.yml
          rm -f tools/migrations/apply-pr288-weight-normalization.js
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Use current level and rarity loot authority"
          git push
