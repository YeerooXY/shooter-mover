name: Diagnose mass rename commit

on:
  push:
    branches:
      - agent/remove-legacy-names-everywhere

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-legacy-names-everywhere
          fetch-depth: 0

      - name: Build rename commit locally and report
        shell: bash
        run: |
          set -euo pipefail
          start_sha="$(git rev-parse HEAD)"
          awk '
            /python3 - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/remove-legacy-type-names.yml > /tmp/rename.py

          set +e
          python3 /tmp/rename.py > /tmp/python.log 2>&1
          python_status=$?
          if [ "$python_status" -eq 0 ]; then
            rm -f docs/audits/REPOSITORY_NAMING_REMOVAL_AUDIT.md
            rm -f docs/audits/CLEAR_GAME_NAMING_PLAN.md
            rm -f docs/audits/REPOSITORY_RENAME_DIAGNOSTIC.md
            rm -f docs/audits/REPOSITORY_RENAME_FAILURE.md
            rm -f docs/audits/.run-full-rename
            rm -f .github/workflows/remove-legacy-type-names.yml
            git add -A > /tmp/add.log 2>&1
            add_status=$?
            git diff --cached --check > /tmp/check.log 2>&1
            check_status=$?
            git config user.name "shooter-mover-naming-bot"
            git config user.email "naming-bot@users.noreply.github.com"
            git commit -m "Remove warning-style type names everywhere" > /tmp/commit.log 2>&1
            commit_status=$?
            changed_count="$(git show --stat --oneline --format='' HEAD | tail -n 1 || true)"
            commit_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          else
            add_status=99
            check_status=99
            commit_status=99
            changed_count="not attempted"
            commit_sha="not attempted"
          fi
          set -e

          git reset --hard "$start_sha"
          {
            echo "# Mass Rename Commit Diagnostic"
            echo
            echo "- Python status: **$python_status**"
            echo "- Git add status: **$add_status**"
            echo "- Diff check status: **$check_status**"
            echo "- Commit status: **$commit_status**"
            echo "- Local commit SHA: \`$commit_sha\`"
            echo "- Stat summary: $changed_count"
            echo
            echo "## Python"
            echo '```text'
            cat /tmp/python.log
            echo '```'
            echo
            echo "## Git add"
            echo '```text'
            cat /tmp/add.log 2>/dev/null || true
            echo '```'
            echo
            echo "## Diff check"
            echo '```text'
            cat /tmp/check.log 2>/dev/null || true
            echo '```'
            echo
            echo "## Commit"
            echo '```text'
            cat /tmp/commit.log 2>/dev/null || true
            echo '```'
          } > docs/audits/MASS_RENAME_COMMIT_DIAGNOSTIC.md

          rm .github/workflows/diagnose-rename-commit.yml
          git add -A
          git diff --check
          git commit -m "Record mass rename commit diagnostic"
          git push origin HEAD:agent/remove-legacy-names-everywhere
