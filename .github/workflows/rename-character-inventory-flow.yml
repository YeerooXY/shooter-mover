name: Rename character and inventory flow

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  rename-flow:
    if: github.head_ref == 'agent/rename-character-inventory-flow'
    runs-on: ubuntu-latest
    steps:
      - name: Check out rename branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply mechanical renames
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('Assets/ShooterMover')
          replacements = {
              'ProductionFlowCoordinatorV1': 'GameFlow',
              'ProductionCharacterAccountCompositionV1': 'CharacterAccount',
              'IProductionCharacterProfileLifecycleV1': 'ICharacterProfiles',
              'ProductionHubLoadoutCompositionV1': 'InventoryLoadoutFlow',
              'ProductionInventoryWeaponCardsPresenterV1': 'InventoryWeaponCards',
          }
          renames = {
              Path('Assets/ShooterMover/UI/ProductionFlow/ProductionFlowCoordinatorV1.cs'):
                  Path('Assets/ShooterMover/UI/ProductionFlow/GameFlow.cs'),
              Path('Assets/ShooterMover/UI/ProductionFlow/ProductionCharacterAccountCompositionV1.cs'):
                  Path('Assets/ShooterMover/UI/ProductionFlow/CharacterAccount.cs'),
              Path('Assets/ShooterMover/UI/ProductionFlow/ProductionHubLoadoutCompositionV1.cs'):
                  Path('Assets/ShooterMover/UI/ProductionFlow/InventoryLoadoutFlow.cs'),
              Path('Assets/ShooterMover/UI/ProductionFlow/ProductionInventoryWeaponCardsPresenterV1.cs'):
                  Path('Assets/ShooterMover/UI/ProductionFlow/InventoryWeaponCards.cs'),
          }

          for path in root.rglob('*.cs'):
              text = path.read_text(encoding='utf-8-sig')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='\n')

          for old, new in renames.items():
              if not old.exists():
                  raise SystemExit(f'Missing rename source: {old}')
              if new.exists():
                  raise SystemExit(f'Rename destination already exists: {new}')
              old.rename(new)
              old_meta = Path(str(old) + '.meta')
              new_meta = Path(str(new) + '.meta')
              if old_meta.exists():
                  old_meta.rename(new_meta)

          remaining = []
          for path in root.rglob('*.cs'):
              text = path.read_text(encoding='utf-8-sig')
              for old in replacements:
                  if old in text:
                      remaining.append(f'{path}: {old}')
          if remaining:
              raise SystemExit('Old names remain:\n' + '\n'.join(remaining))
          PY

          git diff --check
          git status --short

      - name: Commit rename
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "shooter-mover-rename-bot"
          git config user.email "rename-bot@users.noreply.github.com"
          git rm -- .github/workflows/rename-character-inventory-flow.yml
          git add -- Assets/ShooterMover
          git diff --cached --check
          git commit -m "Simplify character and inventory flow names"
          git push origin HEAD:${{ github.head_ref }}
