name: Level Maker tests

on:
  pull_request:
    paths:
      - "Content/Enemies/**"
      - "tools/enemy-maker/enemy-schema.js"
      - "tools/level-maker/**"
      - ".github/workflows/level-maker-tests.yml"
  push:
    branches:
      - main
    paths:
      - "Content/Enemies/**"
      - "tools/enemy-maker/enemy-schema.js"
      - "tools/level-maker/**"
      - ".github/workflows/level-maker-tests.yml"

jobs:
  level-maker:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check scripts
        working-directory: tools/level-maker
        run: |
          node --check floor-data.js
          node --check level-state.js
          node --check level-save.js
          node --check level-authoring.js
          node --check authoring-ux.js
          node --check level-maker-ui-policy.js
          node --check editor-file.js
          node --check enemy-definition-assets.js
          node --check start-server.js
          for file in app-*.js; do node --check "$file"; done

      - name: Run tests
        working-directory: tools/level-maker
        run: |
          node compat-names.test.js
          node floor-data.test.js
          node level-state.test.js
          node level-save.test.js
          node level-authoring.test.js
          node map-door-shortcut.test.js
          node authoring-ux.test.js
          node level-maker-ui-policy.test.js
          node app-19-save.test.js
          node editor-file.test.js
          node enemy-definition-assets.test.js
