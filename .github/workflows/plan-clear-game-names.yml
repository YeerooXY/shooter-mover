name: Plan clear game names

on:
  push:
    branches:
      - agent/remove-legacy-names-everywhere

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-legacy-names-everywhere
          fetch-depth: 0

      - name: Build collision-aware rename plan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import collections
          import re

          root = Path('Assets/ShooterMover')
          declaration = re.compile(
              r'\b(?P<kind>class|interface|struct|enum|record)\s+'
              r'(?P<name>[A-Za-z_][A-Za-z0-9_]*)')
          namespace_re = re.compile(r'\bnamespace\s+([A-Za-z_][A-Za-z0-9_.]*)')
          camel = re.compile(r'[A-Z]+(?=[A-Z][a-z]|\d|$)|[A-Z]?[a-z]+|\d+')
          version = re.compile(r'V\d+(?=[A-Z_]|$)')
          replace = {
              'Production': '',
              'Canonical': '',
              'Composition': 'Setup',
              'Projection': 'View',
              'Authority': 'State',
              'Adapter': 'Bridge',
              'Runtime': 'Live',
              'Service': 'Actions',
              'Coordinator': 'Flow',
          }

          def split(name):
              return camel.findall(version.sub('', name))

          def clean(name):
              result = []
              for word in split(name):
                  mapped = replace.get(word, word)
                  if not mapped:
                      continue
                  if result and result[-1] == mapped:
                      continue
                  result.append(mapped)
              return ''.join(result)

          records = []
          by_scope = collections.defaultdict(list)
          by_name = collections.defaultdict(list)
          for path in sorted(root.rglob('*.cs')):
              text = path.read_text(encoding='utf-8-sig')
              ns_match = namespace_re.search(text)
              namespace = ns_match.group(1) if ns_match else '<global>'
              for match in declaration.finditer(text):
                  name = match.group('name')
                  proposed = clean(name)
                  record = {
                      'name': name,
                      'proposed': proposed,
                      'kind': match.group('kind'),
                      'namespace': namespace,
                      'path': str(path),
                  }
                  records.append(record)
                  by_scope[(namespace, name)].append(record)
                  by_name[name].append(record)

          changed = [row for row in records if row['name'] != row['proposed']]
          unique_changes = {}
          for row in changed:
              unique_changes[row['name']] = row['proposed']

          proposed_in_scope = collections.defaultdict(set)
          sources_in_scope = collections.defaultdict(set)
          for (namespace, old), rows in by_scope.items():
              proposed = clean(old)
              proposed_in_scope[(namespace, proposed)].add(old)
              sources_in_scope[(namespace, proposed)].update(row['path'] for row in rows)

          collisions = []
          for (namespace, proposed), old_names in sorted(proposed_in_scope.items()):
              if not proposed or len(old_names) > 1:
                  collisions.append((namespace, proposed, sorted(old_names), sorted(sources_in_scope[(namespace, proposed)])))

          file_moves = []
          for path in sorted(root.rglob('*.cs')):
              stem = path.stem
              new_stem = clean(stem)
              if new_stem != stem:
                  file_moves.append((str(path), str(path.with_name(new_stem + '.cs'))))

          report = []
          report.append('# Clear Game Naming Plan')
          report.append('')
          report.append(f'- Type declarations scanned: **{len(records)}**')
          report.append(f'- Declarations whose names change: **{len(changed)}**')
          report.append(f'- Unique identifier replacements: **{len(unique_changes)}**')
          report.append(f'- Matching C# file moves: **{len(file_moves)}**')
          report.append(f'- Same-namespace collision groups: **{len(collisions)}**')
          report.append('')
          report.append('## Rules')
          report.append('')
          report.append('- Remove `Production` and `Canonical`.')
          report.append('- Remove numeric `V1` / `V2` style tags.')
          report.append('- `Composition` → `Setup`.')
          report.append('- `Projection` → `View`.')
          report.append('- `Authority` → `State`.')
          report.append('- `Adapter` → `Bridge`.')
          report.append('- `Runtime` → `Live`.')
          report.append('- `Service` → `Actions`.')
          report.append('- `Coordinator` → `Flow`.')
          report.append('')
          report.append('## Remaining collisions')
          report.append('')
          if not collisions:
              report.append('None.')
          for namespace, proposed, old_names, paths in collisions:
              report.append(f'### `{namespace}.{proposed or "<empty>"}`')
              report.append('')
              for old in old_names:
                  report.append(f'- `{old}`')
              for path in paths:
                  report.append(f'  - `{path}`')
              report.append('')

          report.append('## Identifier replacements')
          report.append('')
          report.append('| Current | New |')
          report.append('|---|---|')
          for old, new in sorted(unique_changes.items()):
              report.append(f'| `{old}` | `{new}` |')

          report.append('')
          report.append('## Matching file moves')
          report.append('')
          for old, new in file_moves:
              report.append(f'- `{old}` → `{new}`')

          out = Path('docs/audits/CLEAR_GAME_NAMING_PLAN.md')
          out.write_text('\n'.join(report) + '\n', encoding='utf-8')
          PY

          git config user.name "shooter-mover-naming-bot"
          git config user.email "naming-bot@users.noreply.github.com"
          rm .github/workflows/plan-clear-game-names.yml
          git add -A
          git diff --check
          git commit -m "Plan clear repository names"
          git push origin HEAD:agent/remove-legacy-names-everywhere
