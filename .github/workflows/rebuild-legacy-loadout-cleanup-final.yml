name: Rebuild final legacy loadout cleanup

on:
  push:
    branches:
      - cleanup/remove-legacy-loadout-system-final

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-legacy-loadout-system-final
          fetch-depth: 0

      - name: Apply cleanup diff over current main
        shell: bash
        run: |
          set -euo pipefail
          source_branch='origin/cleanup/remove-legacy-loadout-system'
          source_base='8bb07f396507ad763b33a94da1551e71f68c867a'
          git fetch origin cleanup/remove-legacy-loadout-system

          while IFS=$'\t' read -r status first second; do
            [ -z "$status" ] && continue
            case "$status" in
              A|M|T)
                git checkout "$source_branch" -- "$first"
                ;;
              D)
                git rm -f --ignore-unmatch -- "$first"
                ;;
              R*|C*)
                git rm -f --ignore-unmatch -- "$first"
                git checkout "$source_branch" -- "$second"
                ;;
              *)
                echo "Unsupported diff status: $status $first $second" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-status "$source_base" "$source_branch")

          rm -f .github/workflows/rebuild-legacy-loadout-cleanup-final.yml

          if grep -RInE --include='*.cs' \
            'RetiredArmorLoadoutCompatibility|ExactInstanceLoadout|InventoryLoadoutStateSnapshot|InventoryLoadoutStateCommand|InventoryLoadoutStateResult|InventoryLoadoutStateMutationStatus|IInventoryLoadoutStatePort|InventoryLoadoutSlots|InventoryLoadoutSlotIds|InventoryLoadoutScreenActions|InventoryLoadoutScreenSnapshot|ArmorHead|ArmorBody|ArmorLegs|ArmorFeet|armor-slot\.|LegacyGunSetup|RetiredGunSaveMigration|\.LoadoutAuthority\b' \
            Assets/ShooterMover/Runtime Assets/ShooterMover/UI; then
            echo 'Legacy loadout production references remain.' >&2
            exit 1
          fi

          if grep -RInE --include='*.cs' \
            'InventoryLoadoutScreenStatus\.(WrongEquipmentType|IncompleteGunLoadout|StaleSelection|AuthoritySnapshotMismatch)' \
            Assets/ShooterMover; then
            echo 'Removed Inventory status values remain referenced.' >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          required = {
              "Assets/ShooterMover/Tests/EditMode/Flow/Hub/OpaqueGunInstanceIdentityTests.cs":
                  "StarterLoadout.CreateStarter",
              "Assets/ShooterMover/Tests/PlayMode/Flow/InventoryLoadout/GunCardsTests.cs":
                  "StarterLoadout.StarterGunDefinitionId",
          }
          for path, marker in required.items():
              text = Path(path).read_text(encoding="utf-8")
              if marker not in text:
                  raise RuntimeError(f"Canonical coverage missing from {path}")

          for path in Path("Assets/ShooterMover").rglob("*.cs"):
              text = path.read_text(encoding="utf-8")
              if "new InventoryMenuActions(" not in text:
                  continue
              if "runtime.Holdings,\n" in text and "new InventoryMenuActions(" in text:
                  raise RuntimeError(f"Old InventoryMenuActions constructor remains in {path}")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove legacy armor loadout system"
          git push origin HEAD:cleanup/remove-legacy-loadout-system-final
