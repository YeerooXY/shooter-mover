name: Remove legacy type names

on:
  push:
    branches:
      - agent/remove-legacy-names-everywhere

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-legacy-names-everywhere
          fetch-depth: 0

      - name: Rename every warning-style type and matching C# file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import collections
          import re
          import subprocess

          root = Path('Assets/ShooterMover')
          declaration = re.compile(
              r'\b(?P<kind>class|interface|struct|enum|record)\s+'
              r'(?P<name>[A-Za-z_][A-Za-z0-9_]*)')
          namespace_re = re.compile(r'\bnamespace\s+([A-Za-z_][A-Za-z0-9_.]*)')
          identifier = re.compile(r'\b[A-Za-z_][A-Za-z0-9_]*\b')
          camel = re.compile(r'[A-Z]+(?=[A-Z][a-z]|\d|$)|[A-Z]?[a-z]+|\d+')
          version = re.compile(r'V\d+(?=[A-Z_]|$)')
          replacements = {
              'Production': '',
              'Canonical': '',
              'Composition': 'Setup',
              'Projection': 'View',
              'Authority': 'State',
              'Adapter': 'Bridge',
              'Runtime': 'Live',
              'Service': 'Actions',
              'Coordinator': 'Flow',
          }
          custom = {
              'ProductionWeaponInventoryStateV1': 'LegacyWeaponInventory',
              'ProductionWeaponInventoryStateV2': 'WeaponInventory',
              'ProductionWeaponMountBindingV1': 'WeaponMountViewBinding',
              'WeaponMountBindingV2': 'WeaponMountBinding',
              'ProductionWeaponOnboardingV1': 'LegacyWeaponSetup',
              'ProductionWeaponOnboardingV2': 'WeaponOnboarding',
              'RoomLiveRuntimeAuthorityV1': 'RoomFlowState',
              'RoomRuntimeAuthorityV1': 'RoomOccupancyState',
              'V1DecorDto': 'RoomContentDecorDto',
              'V1DoorDto': 'RoomContentDoorDto',
              'V1DoorLinkDto': 'RoomContentDoorLinkDto',
              'V1EncounterDto': 'RoomContentEncounterDto',
              'V1EnemiesDto': 'RoomContentEnemiesDto',
              'V1ManifestDto': 'RoomContentManifestDto',
              'V1PropsDto': 'RoomContentPropsDto',
              'V1RoomDocumentsDto': 'RoomContentDocumentsDto',
              'V1RoomLayoutDto': 'RoomContentLayoutDto',
              'V1SpawnDto': 'RoomContentSpawnDto',
              'CollectedRunRewardPreparedTransferAuthorityV1':
                  'CollectedRunRewardPreparedTransferStore',
              'CollectedRunRewardPreparedTransferStateV1':
                  'CollectedRunRewardPreparedTransferState',
              'ICollectedRunEquipmentPayloadSourceV2':
                  'ICollectedRunWeaponPayloadSource',
              'DestructiblePropAuthority': 'DestructiblePropDamage',
              'StatusEffectCommandCanonicalV1': 'StatusEffectCommand',
              'StatusEffectCommandV1': 'LegacyStatusEffectCommand',
              'StatusEffectAuthoritySnapshotV1': 'StatusEffectLedgerSnapshot',
              'StatusEffectStateSnapshotV1': 'StatusEffectStateSnapshot',
              'DoorDtoV2': 'AuthoredDoorDto',
              'DoorsDtoV2': 'AuthoredDoorsDto',
              'EndpointDtoV2': 'AuthoredEndpointDto',
              'LevelDtoV2': 'AuthoredLevelDto',
              'MapDtoV2': 'AuthoredMapDto',
              'MapNodeDtoV2': 'AuthoredMapNodeDto',
              'RoomDtoV2': 'AuthoredRoomDto',
              'RoomIndexDtoV2': 'AuthoredRoomIndexDto',
              'RoomLiveRuntimeAuthorityTests': 'RoomFlowStateTests',
              'RoomRuntimeAuthorityTests': 'RoomOccupancyStateTests',
          }

          def words(name):
              return camel.findall(version.sub('', name))

          def clean(name):
              if name in custom:
                  return custom[name]
              output = []
              for word in words(name):
                  mapped = replacements.get(word, word)
                  if not mapped:
                      continue
                  if output and output[-1] == mapped:
                      continue
                  output.append(mapped)
              return ''.join(output)

          declarations = []
          declared_names = set()
          by_scope = collections.defaultdict(set)
          for path in sorted(root.rglob('*.cs')):
              text = path.read_text(encoding='utf-8-sig')
              match = namespace_re.search(text)
              namespace = match.group(1) if match else '<global>'
              for found in declaration.finditer(text):
                  old = found.group('name')
                  new = clean(old)
                  declarations.append((namespace, old, new, str(path)))
                  declared_names.add(old)
                  by_scope[(namespace, new)].add(old)

          missing_custom = sorted(set(custom) - declared_names)
          if missing_custom:
              raise SystemExit('Custom rename keys were not found: ' + ', '.join(missing_custom))

          collisions = []
          for (namespace, proposed), old_names in sorted(by_scope.items()):
              if not proposed or len(old_names) > 1:
                  collisions.append((namespace, proposed, sorted(old_names)))
          if collisions:
              lines = ['Unresolved same-namespace type collisions:']
              for namespace, proposed, old_names in collisions:
                  lines.append(f'{namespace}.{proposed}: {", ".join(old_names)}')
              raise SystemExit('\n'.join(lines))

          mapping = {old: clean(old) for old in declared_names if clean(old) != old}
          if not mapping:
              raise SystemExit('No type names required changes.')

          def replace_tokens(text):
              return identifier.sub(lambda m: mapping.get(m.group(0), m.group(0)), text)

          skip_suffixes = {
              '.png', '.jpg', '.jpeg', '.gif', '.bmp', '.tga', '.psd', '.fbx',
              '.wav', '.mp3', '.ogg', '.mp4', '.mov', '.dll', '.so', '.a',
              '.ttf', '.otf', '.assetbundle', '.zip', '.gz', '.7z', '.pdf'
          }
          for path in sorted(Path('.').rglob('*')):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() in skip_suffixes:
                  continue
              data = path.read_bytes()
              if b'\0' in data:
                  continue
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              updated = replace_tokens(text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='\n')

          def moved_name(path):
              name = path.name
              if name.endswith('.cs.meta'):
                  body = name[:-8]
                  ending = '.cs.meta'
              elif name.endswith('.cs'):
                  body = name[:-3]
                  ending = '.cs'
              else:
                  return path
              pieces = body.split('.')
              changed = []
              for piece in pieces:
                  changed.append(mapping.get(piece, clean(piece)))
              return path.with_name('.'.join(changed) + ending)

          moves = []
          for path in sorted(root.rglob('*.cs')):
              target = moved_name(path)
              if target != path:
                  moves.append((path, target))
              meta = Path(str(path) + '.meta')
              if meta.exists():
                  meta_target = moved_name(meta)
                  if meta_target != meta:
                      moves.append((meta, meta_target))

          targets = collections.defaultdict(list)
          moving_sources = {old for old, _ in moves}
          for old, new in moves:
              targets[new].append(old)
          bad_targets = []
          for target, sources in targets.items():
              if len(sources) > 1:
                  bad_targets.append(
                      f'{target}: ' + ', '.join(str(source) for source in sources))
              elif target.exists() and target not in moving_sources:
                  bad_targets.append(f'{target}: target already exists')
          if bad_targets:
              raise SystemExit('File rename collisions:\n' + '\n'.join(bad_targets))

          staged = []
          for index, (old, new) in enumerate(moves):
              temporary = old.with_name(f'.rename-{index:05d}-' + old.name)
              subprocess.run(['git', 'mv', str(old), str(temporary)], check=True)
              staged.append((temporary, new))
          for temporary, new in staged:
              new.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(['git', 'mv', str(temporary), str(new)], check=True)

          warning_left = []
          for path in sorted(root.rglob('*.cs')):
              text = path.read_text(encoding='utf-8-sig')
              for found in declaration.finditer(text):
                  name = found.group('name')
                  bad = [word for word in words(name) if word in replacements]
                  if bad or version.search(name):
                      warning_left.append(f'{path}: {name}')
              body = path.stem
              bad_file = [word for word in words(body) if word in replacements]
              if bad_file or version.search(body):
                  warning_left.append(f'{path}: filename')
          if warning_left:
              raise SystemExit(
                  'Warning-style type or filename names remain:\n'
                  + '\n'.join(warning_left[:200]))

          old_references = []
          token_set = set(mapping)
          for path in sorted(Path('.').rglob('*')):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() in skip_suffixes:
                  continue
              data = path.read_bytes()
              if b'\0' in data:
                  continue
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              found = token_set.intersection(identifier.findall(text))
              if found:
                  old_references.append(f'{path}: {", ".join(sorted(found)[:10])}')
          if old_references:
              raise SystemExit(
                  'Old type identifiers remain:\n' + '\n'.join(old_references[:200]))
          PY

          rm -f docs/audits/REPOSITORY_NAMING_REMOVAL_AUDIT.md
          rm -f docs/audits/CLEAR_GAME_NAMING_PLAN.md
          rm .github/workflows/remove-legacy-type-names.yml

          git config user.name "shooter-mover-naming-bot"
          git config user.email "naming-bot@users.noreply.github.com"
          git add -A
          git diff --check
          git commit -m "Remove warning-style type names everywhere"
          git push origin HEAD:agent/remove-legacy-names-everywhere
