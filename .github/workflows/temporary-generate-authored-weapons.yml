name: Temporary authored weapon generation

on:
  push:
    branches:
      - fix/json-weapon-catalog-cutover

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/json-weapon-catalog-cutover
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate exporter syntax
        run: |
          node --check tools/item-maker/runtime-export.js
          node --check tools/item-maker/server.js

      - name: Generate production catalogue
        run: node tools/item-maker/runtime-export.js .

      - name: Run focused exporter test
        run: node tools/item-maker/runtime-export.test.js

      - name: Commit generated catalogue
        run: |
          if git diff --quiet -- Assets/ShooterMover/Runtime/Application/Guns/Catalog/AuthoredGunCatalogue.Generated.cs; then
            echo "Generated catalogue already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/ShooterMover/Runtime/Application/Guns/Catalog/AuthoredGunCatalogue.Generated.cs
          git commit -m "Generate Weapon Maker production catalogue"
          git push origin HEAD:fix/json-weapon-catalog-cutover
