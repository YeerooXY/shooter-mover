name: PR288 ignore legacy weights

on:
  push:
    branches:
      - codex/pr288-weapon-migration-v3

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove legacy weight mapping and regenerate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/migrations/import-pr288-weapons.js')
          text = path.read_text()
          replacements = [
              ('      lines.push(`                            ${csharpNumber(d.FinalBaseWeight)},`);\n', ''),
              ('  lines.push("            public Pr288MarkSource(int mark, int peak, double weight, FireSettings fire, GunShotPattern shot, double damage, GunDamageCategory category, int pierce, double knockback, double range, double speed, double radius)");\n',
               '  lines.push("            public Pr288MarkSource(int mark, int peak, FireSettings fire, GunShotPattern shot, double damage, GunDamageCategory category, int pierce, double knockback, double range, double speed, double radius)");\n'),
              ('  lines.push("                Mark = mark; Peak = peak; Weight = weight; Fire = fire; Shot = shot; Damage = damage; Category = category; Pierce = pierce; Knockback = knockback; Range = range; Speed = speed; Radius = radius;");\n',
               '  lines.push("                Mark = mark; Peak = peak; Fire = fire; Shot = shot; Damage = damage; Category = category; Pierce = pierce; Knockback = knockback; Range = range; Speed = speed; Radius = radius;");\n'),
              ('  lines.push("            public int Mark { get; } public int Peak { get; } public double Weight { get; }");\n',
               '  lines.push("            public int Mark { get; } public int Peak { get; }");\n'),
              ('  lines.push("                        GunDropAvailability.Live, source.Peak, source.Weight,");\n',
               '  lines.push("                        GunDropAvailability.Live, source.Peak, PlaceholderBaseWeight,");\n'),
              ('    "- Because current production rarity is family-owned, generated families use the highest normalized rarity among their Marks.",\n',
               '    "- Because current production rarity is family-owned, generated families use the highest normalized rarity among their Marks.",\n    "- Historical `FinalBaseWeight` values are preserved only in the source manifest and are not imported into live drop selection; current peak-level and rarity rules remain authoritative.",\n')
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          node tools/migrations/import-pr288-weapons.js > /tmp/pr288-summary.json
          node --check tools/migrations/import-pr288-weapons.js
          git diff --check
          ! grep -q 'source.Weight' Assets/ShooterMover/Runtime/Application/Guns/Catalog/GunCatalogue.Pr288.Generated.cs
          ! grep -q 'FinalBaseWeight' Assets/ShooterMover/Runtime/Application/Guns/Catalog/GunCatalogue.Pr288.Generated.cs
          grep -q 'source.Peak, PlaceholderBaseWeight' Assets/ShooterMover/Runtime/Application/Guns/Catalog/GunCatalogue.Pr288.Generated.cs
          git add -A
          git diff --cached --binary > /tmp/first.patch
          node tools/migrations/import-pr288-weapons.js > /tmp/pr288-rerun.json
          git add -A
          git diff --cached --binary > /tmp/second.patch
          cmp /tmp/first.patch /tmp/second.patch
      - name: Commit corrected deterministic output
        run: |
          rm -f .github/workflows/pr288-ignore-legacy-weights.yml
          rm -f .github/workflows/pr288-weight-normalization.yml
          rm -f tools/migrations/apply-pr288-weight-normalization.js
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Ignore historical PR #288 drop weights"
          git push
