name: Apply playable character context repair

on:
  push:
    branches:
      - agent/playable-character-context-001
    paths:
      - .github/workflows/apply-playable-character-context-001.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/playable-character-context-001
          fetch-depth: 0

      - name: Apply bounded source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          account = Path("Assets/ShooterMover/UI/ProductionFlow/ProductionCharacterAccountCompositionV1.cs")
          replace_once(
              account,
              '''        public string Diagnostic
                  {
                      get { return diagnostic; }
                  }
          ''',
              '''        public string Diagnostic
                  {
                      get { return diagnostic; }
                  }

                  public static string CurrentDiagnostic
                  {
                      get
                      {
                          EnsureInstalled();
                          return instance == null
                              ? "character-account-composition-missing"
                              : string.IsNullOrWhiteSpace(instance.diagnostic)
                                  ? "character-account-current-runtime-unavailable"
                                  : instance.diagnostic;
                      }
                  }
          ''')
          replace_once(
              account,
              '''            instance = this;
                      flow = GetComponent<ProductionFlowCoordinatorV1>();
                      Initialize();
          ''',
              '''            instance = this;
                      flow = GetComponent<ProductionFlowCoordinatorV1>();
                      try
                      {
                          Initialize();
                      }
                      catch (Exception exception)
                      {
                          if (exception is OutOfMemoryException
                              || exception is StackOverflowException
                              || exception is AccessViolationException)
                          {
                              throw;
                          }
                          Fail(
                              "character-composition-initialize-threw:"
                                  + DescribeException(exception));
                      }
          ''')
          replace_once(
              account,
              '''            if (!firstAccount)
                      {
                          RetiredWeaponSaveMigrationResultV1 weaponMigration =
          ''',
              '''            graphFactory = ProductionCharacterRuntimeGraphFactoryV1
                          .CreateVerticalSliceDefaults();

                      if (!firstAccount)
                      {
                          RetiredWeaponSaveMigrationResultV1 weaponMigration =
          ''')
          replace_once(
              account,
              '''            accountAuthority = new PlayerAccountSaveAuthorityV1(account);
                      graphFactory = ProductionCharacterRuntimeGraphFactoryV1
                          .CreateVerticalSliceDefaults();
                      composition = new CharacterCompositionCoordinatorV1(
          ''',
              '''            if (!firstAccount)
                      {
                          RequiredCharacterComponentBackfillResultV1 backfill =
                              RequiredCharacterComponentBackfillV1.Migrate(
                                  account,
                                  graphFactory);
                          if (backfill == null || !backfill.Succeeded)
                          {
                              Fail(
                                  "required-character-component-backfill-rejected:"
                                      + (backfill == null
                                          ? "result-null"
                                          : backfill.Diagnostic));
                              return;
                          }
                          if (backfill.Changed)
                          {
                              PlayerAccountStoreResultV1 backfilledSave =
                                  accountStore.Save(backfill.Account);
                              if (backfilledSave == null
                                  || !backfilledSave.Succeeded
                                  || backfilledSave.Snapshot == null)
                              {
                                  Fail(
                                      "required-character-component-backfill-store-rejected:"
                                          + (backfilledSave == null
                                              ? "result-null"
                                              : backfilledSave.RejectionCode));
                                  return;
                              }
                              account = backfilledSave.Snapshot;
                          }
                      }

                      accountAuthority = new PlayerAccountSaveAuthorityV1(account);
                      composition = new CharacterCompositionCoordinatorV1(
          ''')
          replace_once(
              account,
              '''        private static string Hash(string value)
                  {
          ''',
              '''        private static string DescribeException(Exception exception)
                  {
                      if (exception == null)
                      {
                          return "Exception";
                      }
                      Exception root = exception.GetBaseException() ?? exception;
                      string description = exception.GetType().Name;
                      if (!ReferenceEquals(root, exception))
                      {
                          description += "->" + root.GetType().Name;
                      }
                      if (string.IsNullOrWhiteSpace(root.Message))
                      {
                          return description;
                      }
                      string message = root.Message
                          .Replace('\\r', ' ')
                          .Replace('\\n', ' ')
                          .Trim();
                      if (message.Length > 256)
                      {
                          message = message.Substring(0, 256);
                      }
                      return description + ":" + message;
                  }

                  private static string Hash(string value)
                  {
          ''')

          coordinator = Path("Assets/ShooterMover/UI/ProductionFlow/ProductionFlowCoordinatorV1.cs")
          replace_once(
              coordinator,
              '''                if (controller != null)
                          {
                              controller.ConfigureDisconnected(ReturnToHub);
                              controller.Present(
                                  HubRouteV1.Inventory,
                                  transitions.Navigation.Payload);
                          }
          ''',
              '''                if (controller != null)
                          {
                              controller.ConfigureDisconnected(ReturnToHub);
                              ProductionCharacterRuntimeGraphV1 graph;
                              ProductionFlowProfileRecordV1 authoritativeProfile;
                              if (ProductionCharacterAccountCompositionV1.TryResolveCurrent(
                                      out graph,
                                      out authoritativeProfile)
                                  && graph != null
                                  && !graph.IsDisposed
                                  && graph.LoadoutRuntime != null)
                              {
                                  ProductionPlayerLoadoutRuntimeV1 runtime =
                                      graph.LoadoutRuntime;
                                  ProductionWeaponMountLoadoutRegistryV2.Register(
                                      runtime.WeaponHoldings,
                                      runtime.MountLoadoutAuthority);
                                  controller.ConnectCanonicalAuthorities(
                                      runtime.Holdings,
                                      runtime.CatalogAdapter,
                                      runtime.WeaponHoldings,
                                      runtime.LoadoutAuthority,
                                      runtime.MountLayout,
                                      runtime.WeaponCatalog);
                                  controller.ConfigureWeaponPresentation(
                                      runtime.EquipmentCatalog,
                                      runtime.WeaponCatalog);
                                  controller.Present(
                                      HubRouteV1.Inventory,
                                      runtime.CurrentRoutePayload);
                              }
                              else
                              {
                                  controller.Present(
                                      HubRouteV1.Inventory,
                                      transitions.Navigation.Payload);
                                  Debug.LogError(
                                      "inventory-character-context-unavailable:"
                                          + ProductionCharacterAccountCompositionV1
                                              .CurrentDiagnostic,
                                      controller);
                              }
                          }
          ''')

          playable = Path("Assets/ShooterMover/UI/ProductionFlow/ProductionPlayableLevelControllerV1.cs")
          replace_once(
              playable,
              '''                FailAndReturn("playable-level-character-context-missing");
                          return;
          ''',
              '''                FailAndReturn(
                              "playable-level-character-context-missing:"
                                  + ProductionCharacterAccountCompositionV1
                                      .CurrentDiagnostic);
                          return;
          ''')

          composition = Path("Assets/ShooterMover/Runtime/Application/Persistence/Composition/CharacterCompositionCoordinatorV1.cs")
          replace_once(
              composition,
              '''                return Reject(
                              "character-restore-threw:"
                                  + exception.GetType().Name,
                              selected);
          ''',
              '''                return Reject(
                              "character-restore-threw:"
                                  + DescribeException(exception),
                              selected);
          ''')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/ShooterMover/UI/ProductionFlow/ProductionCharacterAccountCompositionV1.cs \
                  Assets/ShooterMover/UI/ProductionFlow/ProductionFlowCoordinatorV1.cs \
                  Assets/ShooterMover/UI/ProductionFlow/ProductionPlayableLevelControllerV1.cs \
                  Assets/ShooterMover/Runtime/Application/Persistence/Composition/CharacterCompositionCoordinatorV1.cs
          git commit -m "Repair account character context startup"
          git push origin HEAD:agent/playable-character-context-001
