name: Temporary compact enemy source edit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-enemy-loot
          fetch-depth: 0

      - name: Apply asserted source replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          enemy = "Assets/ShooterMover/UI/Game/Enemies/CompactEnemy.cs"
          replace_once(
              enemy,
              "using ShooterMover.Domain.Common;\nusing ShooterMover.GameplayEntities;",
              "using ShooterMover.Domain.Common;\nusing ShooterMover.Domain.Enemies;\nusing ShooterMover.GameplayEntities;")
          replace_once(
              enemy,
              "        private StableId roomStableId;\n        private StableId placementStableId;\n        private StableId participantStableId;",
              "        private StableId roomStableId;\n        private StableId placementStableId;\n        private StableId definitionStableId;\n        private StableId participantStableId;")
          replace_once(
              enemy,
              "        public int EnemyLevel { get { return stats.Level; } }\n        public CompactEnemyDefinition Definition { get { return definition; } }",
              "        public int EnemyLevel { get { return stats.Level; } }\n        public CompactEnemyDefinition Definition { get { return definition; } }\n        public StableId RoomStableId { get { return roomStableId; } }\n        public StableId PlacementStableId { get { return placementStableId; } }\n        public StableId DefinitionStableId { get { return definitionStableId; } }")
          replace_once(
              enemy,
              "            placementStableId = placement.InstanceStableId;\n            definition = resolved;",
              "            placementStableId = placement.InstanceStableId;\n            definitionStableId = placement.DefinitionStableId;\n            definition = resolved;")
          replace_once(
              enemy,
              "            currentHealth = Math.Max(0d, currentHealth - hit.Amount);\n            FlashHit();\n            if (currentHealth <= 0d) Defeat();",
              "            currentHealth = Math.Max(0d, currentHealth - hit.Amount);\n            FlashHit();\n            if (currentHealth <= 0d)\n            {\n                Defeat(\n                    EnemyActorDeathCause.IncomingDamage,\n                    hit.EventStableId,\n                    hit.SourceEntityStableId,\n                    hit.SourceRunParticipantStableId);\n            }")
          replace_once(
              enemy,
              "            if (string.Equals(attack.kind, \"suicide\", StringComparison.Ordinal))\n            {\n                Defeat();\n            }",
              "            if (string.Equals(attack.kind, \"suicide\", StringComparison.Ordinal))\n            {\n                Defeat(\n                    EnemyActorDeathCause.DisposableImpact,\n                    NextEventStableId(\"disposable-impact\"),\n                    null,\n                    null);\n            }")
          replace_once(
              enemy,
              "        private void Defeat()\n        {\n            if (defeated) return;\n            defeated = true;\n            currentHealth = 0d;",
              "        private void Defeat(\n            EnemyActorDeathCause cause,\n            StableId triggeringEventStableId,\n            StableId killerEntityStableId,\n            StableId killerParticipantStableId)\n        {\n            if (defeated) return;\n            defeated = true;\n            currentHealth = 0d;\n            Vector2 terminalPosition = transform.position;")
          replace_once(
              enemy,
              "            try\n            {\n                roomOwner.ReportOccupantTerminal(",
              "            if (killerParticipantStableId != null)\n            {\n                try\n                {\n                    RunRewards.ReportCompactEnemyDefeat(\n                        this,\n                        triggeringEventStableId,\n                        killerEntityStableId,\n                        killerParticipantStableId,\n                        cause,\n                        terminalPosition);\n                }\n                catch (Exception exception)\n                {\n                    if (IsFatal(exception)) throw;\n                    Debug.LogError(\n                        \"compact-enemy-reward-report-failed:\"\n                        + exception.Message,\n                        this);\n                }\n            }\n\n            try\n            {\n                roomOwner.ReportOccupantTerminal(")

          level = "Assets/ShooterMover/UI/Game/LevelGame.cs"
          replace_once(
              level,
              "using ShooterMover.Application.Missions.Rooms;\nusing ShooterMover.Content.Definitions.Levels.Selection;",
              "using ShooterMover.Application.Missions.Rooms;\nusing ShooterMover.Application.Persistence.Composition;\nusing ShooterMover.Content.Definitions.Levels.Selection;")
          replace_once(
              level,
              "            CharacterLiveGraph graph;\n            FlowProfileRecord profile;\n            if (!CharacterSave.TryResolveCurrent(\n                    out graph,\n                    out profile)\n                || graph == null\n                || profile == null\n                || graph.IsDisposed)",
              "            CharacterLiveGraph graph;\n            FlowProfileRecord profile;\n            CharacterSetupFlow composition;\n            if (!CharacterSave.TryResolveCurrent(\n                    out graph,\n                    out profile,\n                    out composition)\n                || graph == null\n                || profile == null\n                || composition == null\n                || graph.IsDisposed)")
          replace_once(
              level,
              "            Begin(selectedLevel, graph);",
              "            Begin(selectedLevel, selectedModeStableId, graph, composition);")
          replace_once(
              level,
              "        private void Begin(\n            PlayableLevelDefinition selectedLevel,\n            CharacterLiveGraph graph)",
              "        private void Begin(\n            PlayableLevelDefinition selectedLevel,\n            StableId selectedModeStableId,\n            CharacterLiveGraph graph,\n            CharacterSetupFlow composition)")
          replace_once(
              level,
              "                ValidateImportedLevel();\n                SpawnExactlyOnePlayer();\n                CreateExactlyOneGameplayCamera();",
              "                ValidateImportedLevel();\n                SpawnExactlyOnePlayer();\n                ConfigureRunRewards(selectedModeStableId, composition);\n                CreateExactlyOneGameplayCamera();")
          replace_once(
              level,
              "        private int CountPlayersInScene()",
              "        private void ConfigureRunRewards(\n            StableId selectedModeStableId,\n            CharacterSetupFlow composition)\n        {\n            if (selectedModeStableId == null)\n            {\n                throw Failure(\"playable-level-game-mode-missing\");\n            }\n            if (composition == null)\n            {\n                throw Failure(\"playable-level-character-composition-missing\");\n            }\n            RunRewards rewards = GetComponent<RunRewards>();\n            if (rewards == null)\n            {\n                rewards = gameObject.AddComponent<RunRewards>();\n            }\n            rewards.Configure(\n                levelDefinition,\n                selectedModeStableId,\n                characterGraph,\n                composition,\n                roomRuntime,\n                playerMarker);\n        }\n\n        private int CountPlayersInScene()")
          PY

      - name: Commit live integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/ShooterMover/UI/Game/Enemies/CompactEnemy.cs Assets/ShooterMover/UI/Game/LevelGame.cs
          git commit -m "Connect compact enemy death to run rewards"
          git push origin HEAD:fix/compact-enemy-loot
