name: Apply basic ranked skills

on:
  push:
    branches:
      - agent/add-basic-ranked-skills
    paths:
      - tools/patch-basic-skills.py
      - .github/workflows/apply-basic-skills.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-basic-ranked-skills
          fetch-depth: 0
      - name: Apply exact source changes
        run: python tools/patch-basic-skills.py
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add basic ranked skill effects [skip ci]"
          git push origin HEAD:agent/add-basic-ranked-skills
