<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shooter Mover Weapon Maker</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="weapon-gameplay-maker.css">
  <link rel="stylesheet" href="weapon-balance.css">
</head>
<body>
  <header class="app-header weapon-header">
    <div class="brand">
      <strong>Weapon Maker</strong>
      <span>Configure one weapon family without incompatible choices</span>
    </div>
    <button id="newWeaponButton" type="button">New Weapon</button>
    <button type="button" onclick="location.href='strongbox-simulator.html'">Strongbox Simulator</button>
    <div class="spacer"></div>
    <button id="saveButton" type="button" class="primary">Save Weapon</button>
    <div id="saveStatus" class="status-pill">Not saved</div>
  </header>

  <main class="weapon-workspace">
    <aside class="weapon-left-rail">
      <section class="panel compact-panel">
        <div class="panel-head">Weapons</div>
        <div class="panel-body">
          <div id="repoStatus" class="repo-state">Checking local helper…</div>
          <div class="divider"></div>
          <div class="weapon-list-tools">
            <input id="weaponSearchInput" type="search" placeholder="Search name, rarity, type or level" aria-label="Search weapons">
          </div>
          <div id="weaponList" class="weapon-list"></div>
        </div>
      </section>

      <section class="panel compact-panel">
        <div class="panel-head">Weapon setup</div>
        <div class="panel-body">
          <div id="weaponGlobalEditor" class="weapon-global-editor">
            <div class="help">Loading weapon setup…</div>
          </div>
          <input id="categoryInput" type="hidden" value="normal-firearm">
          <div class="field weapon-key-field">
            <label for="folderInput">Weapon key</label>
            <input id="folderInput" class="mono" value="new_weapon" readonly>
            <div class="hint">Follows the name for a new weapon and stays fixed after saving.</div>
          </div>
          <div id="sourcePath" class="mono help source-path"></div>
        </div>
      </section>
    </aside>

    <section class="panel weapon-editor-panel">
      <div class="editor-mode-bar">
        <button id="gameplayModeButton" type="button" class="active">Gameplay</button>
        <button id="jsonModeButton" type="button">Advanced JSON</button>
      </div>
      <div id="gameplayEditor" class="gameplay-editor">
        <div class="help">Loading weapon stats…</div>
      </div>
      <div id="jsonWorkspace" class="json-workspace hidden">
        <div id="fileTabs" class="file-tabs"></div>
        <div class="panel-body">
          <textarea id="jsonEditor" class="weapon-editor" spellcheck="false"></textarea>
        </div>
      </div>
    </section>

    <aside class="weapon-summary">
      <section class="panel compact-panel">
        <div class="panel-head">Visual check</div>
        <div id="weaponVisualPreview" class="panel-body weapon-visual-preview"></div>
      </section>
      <section class="panel compact-panel">
        <div class="panel-head">Weapon IDs</div>
        <div id="generatedIds" class="panel-body stats"></div>
      </section>
      <section class="panel compact-panel">
        <div class="panel-head">Weapon checks</div>
        <div id="checks" class="panel-body issues"></div>
      </section>
    </aside>
  </main>

  <script src="weapon-folder.js"></script>
  <script src="weapon-dps.js"></script>
  <script src="weapon-gameplay-maker.js"></script>
  <script src="weapon-balance.js"></script>
  <script src="weapon-maker-usability.js"></script>
</body>
</html>
