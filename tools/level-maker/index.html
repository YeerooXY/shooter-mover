<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shooter Mover — Level Maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<header>
  <div class="brand">Level Maker</div>
  <div class="header-group">
    <button id="newBtn">New</button>
    <button id="openRepoBtn">Open level</button>
  </div>
  <div class="header-group secondary">
    <button id="undoBtn" title="Undo · Ctrl+Z">Undo</button>
    <button id="redoBtn" title="Redo · Ctrl+Y">Redo</button>
  </div>
  <div class="spacer"></div>
  <button id="validateBtn">Check</button>
  <details id="projectMenu" class="project-menu">
    <summary>Project</summary>
    <div class="project-menu-popover">
      <button id="openBtn">Import project file</button>
      <button id="downloadBtn">Export project file</button>
    </div>
  </details>
  <button id="saveBtn" hidden>Save to project</button>
  <button class="good" id="exportBtn" title="Write this level into the Unity project so it appears in Levels">▶ Playtest</button>
</header>

<div class="workspace">
<aside id="left">
  <div class="tabs">
    <button data-tab="assets" class="active">Assets</button>
    <button data-tab="rooms">Rooms</button>
    <button data-tab="logic">Logic</button>
  </div>

  <div id="tab-assets" class="tab-page active">
    <div class="panel">
      <div class="search">
        <input id="assetSearch" placeholder="Search assets…">
        <div class="row" style="margin-top:6px">
          <select id="assetFilter" class="grow">
            <option value="all">All types</option>
            <option value="enemy">Enemies</option>
            <option value="prop">Props / walls</option>
            <option value="floor">Floors</option>
            <option value="door">Doors</option>
            <option value="decor">Decor</option>
          </select>
          <button id="addCustomAsset" title="Add asset ID manually">＋</button>
        </div>
      </div>
      <div id="assetList" class="asset-list"></div>
    </div>
  </div>

  <div id="tab-rooms" class="tab-page">
    <div class="panel">
      <div class="row"><button class="primary grow" id="addRoom">Add room</button><button id="duplicateRoom">Duplicate</button></div>
      <div id="roomList" style="margin-top:8px"></div>
    </div>
  </div>

  <div id="tab-logic" class="tab-page">
    <div class="panel">
      <h2>Connections</h2>
      <button id="addConnection" style="margin:0 0 8px">Connect doors</button>
      <div id="connectionList"></div>
    </div>
    <div class="panel">
      <h2>Logic</h2>
      <button id="addLogic">Add rule</button>
      <div id="logicList" style="margin-top:8px"></div>
    </div>
  </div>
</aside>

<main id="stage-wrap">
  <canvas id="stage"></canvas>
  <div id="tools" class="floating">
    <button data-tool="select" class="active" title="Select / move (V)">↖</button>
    <button data-tool="pan" title="Pan (H)">✋</button>
    <button data-tool="enemy" title="Place selected enemy (E)">👾</button>
    <button data-tool="prop" title="Place selected prop (P)">▣</button>
    <button data-tool="tile" title="Paint selected floor tile (F)">▦</button>
    <button data-tool="tile-erase" title="Erase floor tile (X)">⌫</button>
    <button data-tool="wall" title="Place indestructible wall piece (W)">▬</button>
    <button data-tool="door" title="Place door (D)">▥</button>
    <button data-tool="player" title="Set player start">●</button>
    <button data-tool="teleporter" title="Place teleporter (T)">◎</button>
  </div>
  <div id="mode-switch" class="floating">
    <button data-view="room" class="active">Room</button>
    <button data-view="map">Level map</button>
  </div>
  <div id="map-tools" class="floating">
    <button data-map-mode="open" class="active" title="Open a room">Open</button>
    <button data-map-mode="arrange" title="Move rooms and doors on the graph (A)">Arrange</button>
    <button data-map-mode="connect" title="Connect or place room doors (D)">Connect</button>
    <span id="map-mode-help" class="map-mode-help" hidden></span>
  </div>
  <div id="room-focus-tools" class="floating">
    <button id="backToGraph" class="primary">← Map</button>
    <button id="toggleAssetsDrawer">Assets</button>
    <button id="toggleInspectorDrawer">Room</button>
    <span class="divider"></span>
    <button data-placement-mode="single" class="active" title="Place one item per click">Single</button>
    <button data-placement-mode="paint" title="Hold and drag to stamp on every grid cell">Paint</button>
    <span class="divider"></span>
    <label class="grid-label" for="snapSelect" style="margin:0">Grid</label>
    <select id="snapSelect" title="Placement snap">
      <option value="0.25">0.25</option>
      <option value="0.5">0.5</option>
      <option value="1" selected>1</option>
      <option value="2">2</option>
    </select>
    <span id="selected-asset-chip" hidden></span>
  </div>
  <div id="view-hud" class="floating">100% · snap 1</div>
  <div id="room-hud" class="floating"></div>
  <div id="selection-hud" class="floating" hidden></div>
</main>

<aside id="right">
  <div class="panel">
    <h2>Level</h2>
    <div class="grid2">
      <div><label>Level ID</label><input id="levelId"></div>
      <div><label>Target folder</label><input id="targetFolder"></div>
    </div>
    <label>Display name</label><input id="levelName">
    <div class="grid2">
      <div><label>Start room</label><select id="startRoom"></select></div>
      <div><label>Final room</label><select id="finalRoom"></select></div>
    </div>
    <label>Final exit door</label><select id="finalDoor"></select>
  </div>
  <div id="inspector"></div>
</aside>
</div>

<footer>
  <span id="status">Ready.</span>
  <span id="counts"></span>
  <span class="spacer"></span>
</footer>
</div>

<input id="openInput" type="file" accept=".json,.smlvl" hidden>
<dialog id="validationDialog">
  <h2>Check level</h2>
  <div id="validationSummary"></div>
  <div id="validationList" class="validation-list"></div>
  <form method="dialog" style="text-align:right;margin-top:10px"><button>Close</button></form>
</dialog>

<dialog id="customAssetDialog">
  <h2>Add asset</h2>
  <div class="grid2">
    <div><label>Type</label><select id="customAssetType"><option>enemy</option><option>prop</option><option>floor</option><option>door</option><option>decor</option></select></div>
    <div><label>Object ID</label><input id="customAssetId" placeholder="prop.wall-standard"></div>
  </div>
  <label>Label</label><input id="customAssetLabel" placeholder="Standard wall">
  <div class="row" style="justify-content:flex-end;margin-top:12px"><button id="cancelCustomAsset">Cancel</button><button class="primary" id="confirmCustomAsset">Add</button></div>
</dialog>

<script src="floor-data.js"></script>
<script src="level-state.js"></script>
<script src="level-save.js"></script>
<script src="level-authoring.js"></script>
<script src="authoring-ux.js"></script>
<script src="level-maker-ui-policy.js"></script>
<script src="app-1.js"></script>
<script src="app-2.js"></script>
<script src="app-3.js"></script>
<script src="app-4.js"></script>
<script src="app-5.js"></script>
<script src="app-6.js"></script>
<script src="app-7.js"></script>
<script src="app-8.js"></script>
<script src="app-9.js"></script>
<script src="app-10.js"></script>
<script src="app-11.js"></script>
<script src="app-12.js"></script>
<script src="app-13-edit.js"></script>
<script src="app-13-asset-previews.js"></script>
<script src="app-14-view.js"></script>
<script src="app-15-validation.js"></script>
<script src="app-16-brush.js"></script>
<script src="app-17-multiselect.js"></script>
<script src="app-18-door-tools.js"></script>
<script src="app-19-save.js"></script>
<script src="app-20-plan.js"></script>
<script src="app-21-editor.js"></script>
<script src="app-22-recovery.js"></script>
<script src="app-23-floor-cells.js"></script>
<script src="app-24-level-authoring.js"></script>
<script src="app-25-map-door-shortcut.js"></script>
<script src="app-26-authoring-ux.js"></script>
<script src="app-27-generic-assets.js"></script>
<script src="app-28-level-editor-ux.js"></script>
<script src="app-29-catalog-and-bounds.js"></script>
<script src="app-29-teleporters.js"></script>
</body>
</html>
